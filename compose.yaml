services:
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.364
    ports:
      - "127.0.0.1:5002:3000"
    restart: unless-stopped
  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    ports:
      - "127.0.0.1:5001:3000"
    restart: unless-stopped

# The local Python sidecar is the tested default on this Mac. These pinned official
# images are an optional deployment path once Docker Desktop is running. The stock
# analyzer does not include PrivacyGuard's Chinese recognizers.
