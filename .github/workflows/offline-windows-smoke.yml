name: Offline Windows smoke test

on:
  push:
    branches: [datainfra-runtime]
    paths:
      - ".github/workflows/offline-windows-smoke.yml"
      - "scripts/check-offline-windows.ps1"
      - "offline/requirements/windows-*.txt"
      - "offline/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: offline-standard-v0.1.4
    steps:
      - uses: actions/checkout@v4

      - name: Select installation directory
        shell: pwsh
        run: |
          $root = if (Test-Path "D:\") { "D:\PrivacyGuard\v0.1.4" } else { Join-Path $env:USERPROFILE "Documents\PrivacyGuard\v0.1.4" }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          "PRIVACYGUARD_TEST_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Test root: $root"

      - name: Run read-only dependency preflight
        shell: pwsh
        run: |
          & .\scripts\check-offline-windows.ps1 -TargetDirectory $env:PRIVACYGUARD_TEST_ROOT

      - name: Download Windows runtime and shared models
        shell: pwsh
        run: |
          Set-Location $env:PRIVACYGUARD_TEST_ROOT
          $assets = @(
            "PrivacyGuard-standard-windows-x64-runtime-v0.1.4.zip",
            "PrivacyGuard-standard-model-has-v0.1.4.tar.gz",
            "PrivacyGuard-standard-model-paddleocr-v0.1.4.tar.gz",
            "SHA256SUMS"
          )
          foreach ($asset in $assets) {
            gh release download $env:RELEASE_TAG --repo bseazh/PrivacyGuard --pattern $asset --dir .
          }

      - name: Verify SHA-256
        shell: pwsh
        run: |
          Set-Location $env:PRIVACYGUARD_TEST_ROOT
          $manifest = Get-Content .\SHA256SUMS
          $files = @(
            "PrivacyGuard-standard-windows-x64-runtime-v0.1.4.zip",
            "PrivacyGuard-standard-model-has-v0.1.4.tar.gz",
            "PrivacyGuard-standard-model-paddleocr-v0.1.4.tar.gz"
          )
          foreach ($file in $files) {
            $line = $manifest | Where-Object { $_ -match "\s+$([regex]::Escape($file))$" } | Select-Object -First 1
            if (-not $line) { throw "Missing checksum for $file" }
            $expected = ($line -split "\s+")[0].ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for $file" }
            Write-Host "OK $file"
          }

      - name: Extract and install completely offline
        shell: pwsh
        run: |
          $app = Join-Path $env:PRIVACYGUARD_TEST_ROOT "app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Expand-Archive -Path (Join-Path $env:PRIVACYGUARD_TEST_ROOT "PrivacyGuard-standard-windows-x64-runtime-v0.1.4.zip") -DestinationPath $app -Force
          Set-Location $app
          $env:PRIVACYGUARD_NONINTERACTIVE = "1"
          cmd.exe /c .\Install-PrivacyGuard.cmd
          if ($LASTEXITCODE -ne 0) { throw "The one-click installer failed with exit code $LASTEXITCODE." }
          "PRIVACYGUARD_APP_ROOT=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start and verify services
        shell: pwsh
        run: |
          Set-Location $env:PRIVACYGUARD_APP_ROOT
          foreach ($entry in @("Install-PrivacyGuard.cmd","Launch-PrivacyGuard.cmd","Check-PrivacyGuard.cmd","Stop-PrivacyGuard.cmd","Test-PrivacyGuard.ps1")) {
            if (-not (Test-Path $entry)) { throw "Missing one-click entry: $entry" }
          }
          $blocker = Start-Process -PassThru -WindowStyle Hidden -FilePath "python" -ArgumentList @("-m","http.server","8000","--bind","127.0.0.1")
          New-Item -ItemType Directory -Force -Path .\.run | Out-Null
          $blocker.Id | Set-Content .\.run\test-blocker.pid
          Start-Sleep -Seconds 2
          .\Start-PrivacyGuard.ps1 -NoBrowser
          $runtime = Get-Content .\.run\runtime.json -Raw | ConvertFrom-Json
          if ($runtime.backend_port -eq 8000) { throw "Port fallback was not used while 8000 was occupied." }
          $health = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri $runtime.services_url -TimeoutSec 10
              if ($health.services.has_ner.detail.reachable -and $health.services.paddle_ocr.detail.reachable -and $health.services.paddle_ocr.detail.ready) { break }
            } catch {
              Write-Host "Waiting for services ($attempt/60): $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $health) { throw "Backend health endpoint never became available." }
          $health | ConvertTo-Json -Depth 10 | Tee-Object -FilePath (Join-Path $env:PRIVACYGUARD_APP_ROOT "logs\health-services.json")
          if (-not $health.services.has_ner.detail.reachable) { throw "HaS service is not reachable." }
          if (-not $health.services.paddle_ocr.detail.reachable -or -not $health.services.paddle_ocr.detail.ready) { throw "OCR service is not ready." }
          .\Test-PrivacyGuard.ps1
          Invoke-RestMethod -Uri $runtime.health_url -TimeoutSec 10 | ConvertTo-Json -Depth 5

      - name: Stop services
        if: always()
        shell: pwsh
        run: |
          if ($env:PRIVACYGUARD_APP_ROOT -and (Test-Path (Join-Path $env:PRIVACYGUARD_APP_ROOT "Stop-PrivacyGuard.ps1"))) {
            Set-Location $env:PRIVACYGUARD_APP_ROOT
            .\Stop-PrivacyGuard.ps1
          }
          $blockerFile = Join-Path $env:PRIVACYGUARD_APP_ROOT ".run\test-blocker.pid"
          if (Test-Path $blockerFile) { Stop-Process -Id ([int](Get-Content $blockerFile -Raw)) -Force -ErrorAction SilentlyContinue }

      - name: Verify PID reuse protection and failed-start cleanup
        shell: pwsh
        run: |
          Set-Location $env:PRIVACYGUARD_APP_ROOT
          $innocent = Start-Process -PassThru -WindowStyle Hidden -FilePath "python" -ArgumentList @("-m","http.server","39000","--bind","127.0.0.1")
          try {
            $info = Get-CimInstance Win32_Process -Filter "ProcessId = $($innocent.Id)"
            [ordered]@{
              pid = $innocent.Id
              executable = $info.ExecutablePath
              command_markers = @("privacyguard-marker-that-is-not-present")
              started_at = $innocent.StartTime.ToUniversalTime().ToString("o")
            } | ConvertTo-Json | Set-Content .\.run\app.process.json -Encoding utf8
            $innocent.Id | Set-Content .\.run\app.pid
            .\Stop-PrivacyGuard.ps1 -Quiet
            if (-not (Get-Process -Id $innocent.Id -ErrorAction SilentlyContinue)) { throw "PID reuse protection terminated an unrelated process." }
            $stale = Get-Content .\.run\app.process.json -Raw | ConvertFrom-Json
            if ($stale.status -ne "stale") { throw "Identity mismatch was not retained as a stale process record." }
          } finally {
            Stop-Process -Id $innocent.Id -Force -ErrorAction SilentlyContinue
            .\Stop-PrivacyGuard.ps1 -Quiet
          }

          $ocrScript = Join-Path $env:PRIVACYGUARD_APP_ROOT "backend\scripts\ocr_server.py"
          $disabledScript = "$ocrScript.disabled"
          $beforeProcesses = @(Get-CimInstance Win32_Process | Select-Object -ExpandProperty ProcessId)
          Move-Item $ocrScript $disabledScript
          try {
            $failed = $false
            try { .\Start-PrivacyGuard.ps1 -NoBrowser -StartupTimeoutSeconds 10 } catch { $failed = $true }
            if (-not $failed) { throw "The intentionally broken startup unexpectedly succeeded." }
            foreach ($name in @("app","ocr","has")) {
              if (Test-Path ".\.run\$name.process.json") { throw "Failed startup left a process record for $name." }
            }
            $survivors = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ProcessId -notin $beforeProcesses -and $_.CommandLine -and
              $_.CommandLine.IndexOf($env:PRIVACYGUARD_APP_ROOT, [StringComparison]::OrdinalIgnoreCase) -ge 0
            })
            if ($survivors.Count -gt 0) {
              throw "Failed startup left PrivacyGuard processes alive: $($survivors.ProcessId -join ', ')"
            }
            $ownedListeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object {
              $owner = Get-CimInstance Win32_Process -Filter "ProcessId = $($_.OwningProcess)" -ErrorAction SilentlyContinue
              $owner -and $owner.CommandLine -and $owner.CommandLine.IndexOf($env:PRIVACYGUARD_APP_ROOT, [StringComparison]::OrdinalIgnoreCase) -ge 0
            })
            if ($ownedListeners.Count -gt 0) {
              throw "Failed startup left PrivacyGuard listening ports: $($ownedListeners.LocalPort -join ', ')"
            }
          } finally {
            Move-Item $disabledScript $ocrScript -Force
            .\Stop-PrivacyGuard.ps1 -Quiet
          }

      - name: Collect test logs
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "privacyguard-smoke-logs"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          if ($env:PRIVACYGUARD_APP_ROOT -and (Test-Path (Join-Path $env:PRIVACYGUARD_APP_ROOT "logs"))) {
            Copy-Item -Recurse -Force (Join-Path $env:PRIVACYGUARD_APP_ROOT "logs\*") $destination
          }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacyguard-windows-offline-smoke-logs
          path: ${{ runner.temp }}\privacyguard-smoke-logs
          if-no-files-found: warn
          retention-days: 7
