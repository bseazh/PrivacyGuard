[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyguard-local"
version = "0.2.0"
description = "Local-first privacy processing for AI agents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "mcp==2.3.0",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "PyMuPDF==1.26.4",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
secure-llm = ["litellm==1.105.0"]
test = ["pytest>=8,<10", "python-docx>=1.1,<2", "reportlab>=4,<5"]

[project.scripts]
privacyguard = "privacyguard.cli:main"
privacyguard-mcp = "privacyguard.mcp_server:main"
privacyguard-presidio = "privacyguard.presidio_service:main"

[tool.setuptools.packages.find]
include = ["privacyguard*", "service*"]
