<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710">
<rect width="1100" height="710" rx="20" fill="#eef2f6"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#17212f">
<rect x="30" y="25" width="1040" height="660" rx="16" fill="white" stroke="#ccd5df"/>
<text x="60" y="75" font-size="27" font-weight="bold">WorkBuddy · MCP 服务管理（配置示意）</text>
<text x="60" y="108" font-size="16" fill="#586779">示意图，不含真实凭据；使用安装器生成的本机绝对路径</text>
<path d="M30 130H1070" stroke="#d9e1e9"/>
<rect x="60" y="150" width="980" height="44" rx="6" fill="#eef3fa"/>
<text x="75" y="178" font-size="17">① 配置文件：~/.workbuddy/mcp.json</text>
<rect x="60" y="210" width="980" height="310" rx="8" fill="#101b2d"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#d9e9ff">
<text x="82" y="243">{</text><text x="105" y="272">&quot;mcpServers&quot;: {</text>
<text x="130" y="301">&quot;已有的其他服务&quot;: { … },</text>
<text x="130" y="330" fill="#8ee8bd">&quot;privacyguard&quot;: {</text>
<text x="155" y="359">&quot;command&quot;: &quot;/绝对路径/PrivacyGuard/.venv/bin/privacyguard-mcp&quot;,</text>
<text x="155" y="388">&quot;args&quot;: [],</text>
<text x="155" y="417">&quot;env&quot;: { …安装器生成的模型与路径配置… }</text>
<text x="130" y="446">}</text><text x="105" y="475">}</text><text x="82" y="504">}</text>
</g>
<rect x="60" y="540" width="290" height="52" rx="8" fill="#e8f1ff"/>
<text x="78" y="573" font-size="18">② 保留其他 MCP，保存配置</text>
<rect x="370" y="540" width="310" height="52" rx="8" fill="#e8f1ff"/>
<text x="388" y="573" font-size="18">③ 完全退出 → 重开 → 启用</text>
<rect x="700" y="540" width="340" height="52" rx="8" fill="#e6f6ec"/>
<text x="718" y="573" font-size="18">④ 新对话发现 6 个工具 → 测试</text>
<text x="60" y="630" font-size="17">默认调用 privacy_process_and_ask；不要把 safe_file.path 当作 safe_reference。</text>
<text x="60" y="660" font-size="16" fill="#586779">推荐：用 configure_workbuddy.py --apply 自动备份、合并配置，减少手动 JSON 错误。</text>
</g></svg>
