[mcp_servers.privacyguard]
command = "/ABSOLUTE/PATH/TO/PrivacyGuard/.venv/bin/privacyguard-mcp"
startup_timeout_sec = 30
tool_timeout_sec = 1800

[mcp_servers.privacyguard.env]
PRIVACYGUARD_ALLOWED_ROOTS = "/Users/YOUR_NAME/Documents:/Users/YOUR_NAME/Desktop:/Users/YOUR_NAME/Downloads"
PRIVACYGUARD_DATA_DIR = "/Users/YOUR_NAME/.privacyguard"
PRIVACYGUARD_REFERENCE_TTL = "900"
PRIVACYGUARD_PRESIDIO_URL = "http://127.0.0.1:5002"
PRIVACYGUARD_REDACTION_BASE_URL = "http://127.0.0.1:8000"
# Optional: use an existing Apple Silicon MLX environment.
# PRIVACYGUARD_MLX_PYTHON = "/ABSOLUTE/PATH/TO/PrivacyGuard/.venv-mlx/bin/python"
# Optional PrivacyGuard-owned local inference. Never put a real remote key in Git.
# PRIVACYGUARD_LLM_MODEL = "openai//ABSOLUTE/PATH/TO/PrivacyGuard/models/qwen3/Qwen3-1.7B-bf16"
# PRIVACYGUARD_LLM_BASE_URL = "http://127.0.0.1:8011/v1"
# PRIVACYGUARD_LLM_API_KEY = "local-only"
